name: Update Trend Data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
      force:
        description: '强制运行（周末测试用）'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [morning]

concurrency:
  group: trend-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "mode=${{ github.event.action }}" >> $GITHUB_OUTPUT
          else
            echo "mode=morning" >> $GITHUB_OUTPUT
          fi

      - name: 从 gh-pages 恢复历史归档（失败即中止：宁可不部署，也不能抹掉线上归档）
        run: python -m scripts.site_publish restore origin/gh-pages docs

      - name: Run update script
        id: run_script
        run: |
          FORCE_FLAG=""
          # 手动触发时检查 force 参数
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/main.py --mode ${{ steps.mode.outputs.mode }} $FORCE_FLAG
        env:
          TZ: Asia/Shanghai
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}

      # gh-pages 有两个写入方：本 workflow 只发布主站文件；quant/、data/ 归 backtest.yml。
      # keep_files 永不删除线上文件；并发 push 被拒时重试一次（peaceiris 每次重新 clone 最新 gh-pages）。
      - name: 组装主站发布目录（不含 quant/、data/）
        if: steps.run_script.outputs.should_deploy == 'true'
        run: python -m scripts.site_publish stage docs /tmp/site-publish

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.run_script.outputs.should_deploy == 'true'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/site-publish
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Update trend data - ${{ steps.mode.outputs.mode }}'

      - name: 部署失败，等待后重试
        if: steps.run_script.outputs.should_deploy == 'true' && steps.deploy.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages（重试）
        id: deploy_retry
        if: steps.run_script.outputs.should_deploy == 'true' && steps.deploy.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/site-publish
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Update trend data - ${{ steps.mode.outputs.mode }}'

      - name: Send email notification
        if: steps.run_script.outputs.should_deploy == 'true' && (steps.deploy.outcome == 'success' || steps.deploy_retry.outcome == 'success')
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Trend 数据更新完成 - ${{ steps.mode.outputs.mode }}"
          to: ${{ secrets.GMAIL_USER }}
          from: ${{ secrets.GMAIL_USER }}
          body: |
            构建模式: ${{ steps.mode.outputs.mode }}
            运行时间: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            状态: 成功
            
            查看详情: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
