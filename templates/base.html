<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ root }}css/style.css">

    {% if ga_id %}
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_id }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ ga_id }}');
    </script>
    <!-- End Google Analytics -->
    {% endif %}
</head>

<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            {#- 站点级入口槽（右上角）：在此 block 里加 <a href="{{ root }}futures/">期指观察</a>，所有页面同时生效 #}
            <nav class="site-nav">{% block site_nav %}<a href="{{ root }}futures/">期指观察</a>{% endblock %}</nav>
            {% block header %}{% endblock %}
        </div>
{% block content %}{% endblock %}

        <!-- 页脚 -->
        <div class="footer">
            <p>{% block footer %}Powered by AkShare{% endblock %}</p>
        </div>
    </div>
{% block body_end %}{% endblock %}
</body>

</html>
